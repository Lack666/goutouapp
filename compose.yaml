services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goutou_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goutou_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-goutou_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
